name: Publish

# Publishes @invisra/draft to npm using npm Trusted Publishing (OIDC) — no
# NPM_TOKEN required. Provenance attestations are generated automatically.
#
# One-time setup on npmjs.com (Package settings → Trusted Publisher):
#   Provider          : GitHub Actions
#   Organization/user : invisra
#   Repository        : draft
#   Workflow filename : publish.yml
#   Environment       : (leave blank — this workflow declares none)
# See: https://docs.npmjs.com/trusted-publishers
#
# To release: bump the version in package.json, then publish a GitHub Release
# whose tag is `v<version>` (e.g. v0.1.2). The tag must match package.json.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; node 24 ships an older 11.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      # Guard: on a release, the tag (vX.Y.Z) must match package.json version.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$pkg_version'"
            exit 1
          fi

      # prepublishOnly re-runs typecheck + lint + test + build before packing,
      # so a broken build never reaches npm. Run them here too for clear logs.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish
